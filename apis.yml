description: >-
  Pine Medical was a telehealth provider that offered a medication-supported
  weight-loss program pairing licensed clinicians with prescription therapies
  and ongoing patient coaching. The company was surfaced as a portfolio company
  of a16z and added to the API Evangelist network as a stub for enrichment. An
  enrichment probe on 2026-07-20 found the public website (pinemedical.com)
  announcing that Pine Medical wound down its medication-supported weight-loss
  program effective March 30, 2024, and redirects former patients to alternative
  providers and insurance-covered options. No public API, developer portal,
  documentation, or machine-readable API surface was found.
